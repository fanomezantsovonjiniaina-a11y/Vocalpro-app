name: Build APK

on:
  push:
    branches: [ main, Principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project
        run: |
          set -e
          mkdir -p app/src/main/java/mg/vocalpro/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p gradle/wrapper

          cp icon-512.png app/src/main/res/mipmap-hdpi/ic_launcher.png

          cat > settings.gradle <<'GRADLE'
          rootProject.name = "VocalPro"
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE

          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
            compileSdk 34
            namespace "mg.vocalpro.app"
            defaultConfig {
              applicationId "mg.vocalpro.app"
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            buildTypes {
              release {
                minifyEnabled false
                signingConfig signingConfigs.debug
              }
            }
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <application
              android:label="VocalPro"
              android:icon="@mipmap/ic_launcher"
              android:theme="@style/AppTheme">
              <activity
                android:name=".MainActivity"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          XML

          cat > app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
              <item name="android:statusBarColor">#ff5e62</item>
            </style>
          </resources>
          XML

          cat > app/src/main/java/mg/vocalpro/app/MainActivity.java <<'JAVA'
          package mg.vocalpro.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.*;
          public class MainActivity extends Activity {
            WebView wv;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              wv = new WebView(this);
              WebSettings s = wv.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              wv.setWebChromeClient(new WebChromeClient() {
                @Override public void onPermissionRequest(PermissionRequest r) { r.grant(r.getResources()); }
              });
              wv.loadUrl("https://fanomezantsovonjiniaina-a11y.github.io/Vocalpro-app/");
              setContentView(wv);
            }
            @Override public void onBackPressed() {
              if (wv.canGoBack()) wv.goBack(); else super.onBackPressed();
            }
          }
          JAVA

          cat > gradle/wrapper/gradle-wrapper.properties <<'PROPS'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          PROPS

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --project-dir .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VocalPro-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
