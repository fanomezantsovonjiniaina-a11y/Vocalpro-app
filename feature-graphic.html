<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Arial', sans-serif; }
#canvas-wrap {
  width: 1024px;
  height: 500px;
  background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bg-circle {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.3;
}
.bg-circle-1 { width: 600px; height: 600px; background: #ff4f6d; top: -200px; left: -100px; }
.bg-circle-2 { width: 500px; height: 500px; background: #7c3aed; bottom: -200px; right: -100px; }
.bg-circle-3 { width: 300px; height: 300px; background: #06b6d4; top: 100px; right: 200px; }
.content {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 60px;
  padding: 40px;
}
.left { text-align: left; }
.app-icon {
  width: 140px;
  height: 140px;
  border-radius: 32px;
  background: linear-gradient(135deg, #ff4f6d, #7c3aed);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 72px;
  box-shadow: 0 20px 60px rgba(255,79,109,0.5);
  flex-shrink: 0;
}
.app-name {
  font-size: 72px;
  font-weight: 900;
  color: #fff;
  letter-spacing: -2px;
  line-height: 1;
  margin-bottom: 12px;
}
.app-name span { color: #ff4f6d; }
.tagline {
  font-size: 24px;
  color: rgba(255,255,255,0.7);
  margin-bottom: 24px;
  font-weight: 300;
}
.badges {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.badge {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 100px;
  padding: 8px 18px;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}
.wave-wrap {
  position: absolute;
  bottom: 20px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 6px;
  opacity: 0.15;
}
.wave-bar {
  width: 4px;
  border-radius: 2px;
  background: #ff4f6d;
}
#dl-btn {
  margin-top: 24px;
  padding: 14px 32px;
  background: linear-gradient(135deg, #ff4f6d, #7c3aed);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
}
</style>
</head>
<body>
<div id="canvas-wrap">
  <div class="bg-circle bg-circle-1"></div>
  <div class="bg-circle bg-circle-2"></div>
  <div class="bg-circle bg-circle-3"></div>
  <div class="content">
    <div class="app-icon">🎵</div>
    <div class="left">
      <div class="app-name">Vocal<span>Pro</span></div>
      <div class="tagline">Apprenez la musique, chantez mieux</div>
      <div class="badges">
        <div class="badge">🎯 15 Jeux musicaux</div>
        <div class="badge">📊 300 Niveaux</div>
        <div class="badge">🆓 Gratuit</div>
      </div>
    </div>
  </div>
  <div class="wave-wrap" id="waves"></div>
</div>
<button id="dl-btn" onclick="download()">⬇️ Télécharger (1024×500 PNG)</button>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
// generate wave bars
var ww = document.getElementById('waves');
for(var i=0;i<100;i++){
  var h = 20 + Math.random()*60;
  var b = document.createElement('div');
  b.className = 'wave-bar';
  b.style.height = h+'px';
  ww.appendChild(b);
}

function download() {
  html2canvas(document.getElementById('canvas-wrap'), {width:1024,height:500,scale:1}).then(function(canvas){
    var a = document.createElement('a');
    a.download = 'vocalpro-feature-graphic.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
}
</script>
</body>
</html>
